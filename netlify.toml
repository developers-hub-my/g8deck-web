[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Convenience shortcuts to the product console, which is the deployed Laravel
# application at g8deck.app -- not a console.* subdomain, which never existed.
[[redirects]]
  from = "/console"
  to = "https://g8deck.app"
  status = 302
  force = true

[[redirects]]
  from = "/login"
  to = "https://g8deck.app/login"
  status = 302
  force = true

[[redirects]]
  from = "/register"
  to = "https://g8deck.app/register"
  status = 302
  force = true
