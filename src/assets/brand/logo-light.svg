<!--
  G8Deck — horizontal lockup for LIGHT backgrounds.

  Mark in emerald-600 (#059669) — the emerald step calibrated for light
  surfaces; emerald-500 is too pale on white. Wordmark in slate-900 (#0F172A).

  g8deck-web itself is dark-only, so this file is for the contexts the site
  does not control: print, PDF proposals, procurement and tender documents,
  partner directories, slide templates on white.

  Geometry is identical to logo-dark.svg — only the two fills differ.
  No width/height attributes: set the size in CSS or the placing application.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 213 48" fill="none" role="img" aria-label="G8Deck">

  <!-- mark -->
  <path
    fill="#059669"
    fill-rule="evenodd"
    d="M16 6 h16 a10 10 0 0 1 10 10 v4 h-4 v6 h4 v6 a10 10 0 0 1 -10 10 h-16 a10 10 0 0 1 -10 -10 v-6 h4 v-6 h-4 v-4 a10 10 0 0 1 10 -10 z
       M16 12 H32 A4 4 0 0 1 36 16 V18 A2 2 0 0 1 34 20 H14 A2 2 0 0 1 12 18 V16 A4 4 0 0 1 16 12 Z
       M14 26 H34 A2 2 0 0 1 36 28 V32 A4 4 0 0 1 32 36 H16 A4 4 0 0 1 12 32 V28 A2 2 0 0 1 14 26 Z" />

  <!-- wordmark -->
  <g stroke="#0F172A" stroke-width="4.5" stroke-linecap="butt" stroke-linejoin="miter">
    <!-- G -->
    <path d="M70 25 H80 A10 10 0 0 1 70 35 A10 10 0 0 1 60 25 V23 A10 10 0 0 1 70 13 A10 10 0 0 1 78 17" />
    <!-- 8 : stacked bowls, narrower on top — the mark's logic at text scale -->
    <path d="M95 13 h4 a5 5 0 0 1 5 5 v1 a5 5 0 0 1 -5 5 h-4 a5 5 0 0 1 -5 -5 v-1 a5 5 0 0 1 5 -5 z
             M93 24 h8 a5 5 0 0 1 5 5 v1 a5 5 0 0 1 -5 5 h-8 a5 5 0 0 1 -5 -5 v-1 a5 5 0 0 1 5 -5 z" />
    <!-- D -->
    <path d="M115 35 V13 H124 A10 10 0 0 1 134 23 V25 A10 10 0 0 1 124 35 Z" />
    <!-- e -->
    <path d="M142 27 H159 V26.5 A7.5 7.5 0 0 0 151.5 19 H149.5 A7.5 7.5 0 0 0 142 26.5 V27.5 A7.5 7.5 0 0 0 149.5 35 H151.5 A7.5 7.5 0 0 0 156 33.5" />
    <!-- c -->
    <path d="M181.5 22 A7.5 7.5 0 0 0 175.5 19 H174.5 A7.5 7.5 0 0 0 167 26.5 V27.5 A7.5 7.5 0 0 0 174.5 35 H175.5 A7.5 7.5 0 0 0 181.5 32" />
    <!-- k -->
    <path d="M191 13 V35 M191 28 L203 19 M195 25 L205 35" />
  </g>

</svg>
